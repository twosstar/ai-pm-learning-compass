<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">AI PM 学习罗盘 · UI 视觉方向示范</title>
  <desc id="desc">原创小罗盘伙伴、手绘线性图标与轻纸纤维质感构成的学习工作台示范稿。</desc>
  <defs>
    <style>
      .sans { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif; }
      .ink { fill: #17191d; }
      .muted { fill: #72757c; }
      .blue { fill: #245bd6; }
      .stroke { fill: none; stroke: #26343c; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .line { stroke: #e7e7e4; }
      .small { font-size: 14px; }
      .body { font-size: 16px; }
    </style>
    <filter id="paper-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.42" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.075"/></feComponentTransfer>
    </filter>
    <g id="compass-buddy">
      <!-- Original mascot: a soft little wayfinder, drawn in a consistent rounded line style. -->
      <path d="M7 42c0-15 10-25 25-25s25 10 25 25v16H7z" fill="#f2a18c" stroke="#26343c" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M14 24c-7-5-8-12-4-17 8 2 12 7 13 14m22 3c7-5 8-12 4-17-8 2-12 7-13 14" fill="#f6c4a8" stroke="#26343c" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M20 38q3-4 6 0m12 0q3-4 6 0" fill="none" stroke="#26343c" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M30 43q2 2 4 0" fill="none" stroke="#26343c" stroke-width="1.8" stroke-linecap="round"/>
      <ellipse cx="17" cy="44" rx="4" ry="2.4" fill="#dd726b" opacity=".7"/><ellipse cx="47" cy="44" rx="4" ry="2.4" fill="#dd726b" opacity=".7"/>
      <path d="M23 58v5m16-5v5" stroke="#26343c" stroke-width="2.3" stroke-linecap="round"/>
      <path d="m32 3 2.1 5.1L39 10l-4.9 1.9L32 17l-2-5.1L25 10l5-1.9z" fill="#f4c64e" stroke="#26343c" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <g id="icon-book" class="stroke"><path d="M3 5.5c4-2 8-2 12 0v13c-4-2-8-2-12 0z"/><path d="M15 5.5c4-2 8-2 12 0v13c-4-2-8-2-12 0zM15 6v13"/></g>
    <g id="icon-map" class="stroke"><path d="m3 6 7-3 8 3 7-3v18l-7 3-8-3-7 3zM10 3v18m8-15v18"/><circle cx="18" cy="10" r="2"/></g>
  </defs>
  <rect width="1440" height="1000" fill="#f7f7f4"/>
  <rect width="1440" height="1000" filter="url(#paper-grain)" opacity="0.22" pointer-events="none"/>
  <rect x="0" y="0" width="252" height="1000" fill="#fff"/>
  <line x1="252" y1="0" x2="252" y2="1000" stroke="#e7e7e4"/>
  <g class="sans">
    <!-- Brand / navigation -->
    <rect x="32" y="30" width="38" height="38" rx="13" fill="#dce8ff"/>
    <circle cx="51" cy="49" r="11" fill="#fff" stroke="#245bd6" stroke-width="1.5"/>
    <path d="m51 40 2.2 7-2.2 2-2.2-2zM51 49l5 6-5-2-5 2z" fill="#245bd6" stroke="#245bd6" stroke-width="1" stroke-linejoin="round"/>
    <text x="82" y="48" class="ink" font-size="16" font-weight="700">AI PM 学习罗盘</text>
    <text x="82" y="66" class="muted" font-size="11">LEARNING COMPASS</text>
    <text x="34" y="126" class="muted" font-size="11" font-weight="700" letter-spacing="1.4">学习空间</text>
    <rect x="20" y="146" width="212" height="48" rx="14" fill="#edf2ff"/>
    <rect x="20" y="146" width="3" height="48" fill="#245bd6"/>
    <use href="#icon-book" x="35" y="158" width="22" height="22" stroke="#245bd6"/>
    <text x="64" y="176" class="blue" font-size="15" font-weight="700">课程学习</text>
    <use href="#icon-map" x="35" y="214" width="22" height="22" stroke="#72757c"/>
    <text x="64" y="232" class="ink" font-size="15">概念地图</text>
    <text x="34" y="292" class="muted" font-size="11" font-weight="700" letter-spacing="1.4">我的路径</text>
    <text x="42" y="332" class="muted" font-size="13">01　产品判断基础</text>
    <text x="42" y="370" class="muted" font-size="13">02　AI 工作流设计</text>
    <text x="42" y="408" class="muted" font-size="13">03　评估与上线</text>
    <line x1="32" y1="911" x2="220" y2="911" class="line"/>
    <circle cx="42" cy="946" r="5" fill="#2a8b62"/>
    <text x="56" y="950" class="ink" font-size="12">学习进度保存在本机</text>

    <!-- Main header -->
    <text x="304" y="64" class="muted" font-size="12" letter-spacing="1.8">AI PRODUCT MANAGEMENT · 学习工作台</text>
    <text x="304" y="126" class="ink" font-size="36" font-weight="700" letter-spacing="-1.1">把知识学会，再把判断说清楚。</text>
    <!-- A tiny original mascot peeks over the headline without competing with it. -->
    <g transform="translate(806 77) rotate(8)"><use href="#compass-buddy"/></g>
    <text x="304" y="162" class="muted" font-size="16">给准备进入 AI 产品岗位的你：每次学一点，逐步练成能落地的产品思路。</text>
    <line x1="304" y1="194" x2="1396" y2="194" class="line"/>

    <!-- Resume lesson feature -->
    <text x="304" y="237" class="muted small" font-weight="700">接着上次继续</text>
    <text x="304" y="284" class="ink" font-size="25" font-weight="700">工作流、模型与知识检索的组合</text>
    <text x="304" y="317" class="muted body">第 2 单元　·　还剩 3 个知识点　·　约 12 分钟</text>
    <rect x="304" y="342" width="748" height="8" rx="4" fill="#e8e8e5"/>
    <rect x="304" y="342" width="312" height="8" rx="4" fill="#245bd6"/>
    <text x="304" y="378" class="muted small">本节进度 42%</text>
    <rect x="1114" y="250" width="238" height="56" rx="6" fill="#245bd6"/>
    <text x="1233" y="285" fill="#fff" text-anchor="middle" font-size="16" font-weight="700" class="sans">继续学习　→</text>

    <!-- Strong editorial section -->
    <text x="304" y="449" class="ink" font-size="22" font-weight="700">你的学习路径</text>
    <text x="1328" y="449" class="muted small" text-anchor="end">60 节课 · 按顺序，也可自由选择</text>
    <line x1="304" y1="470" x2="1396" y2="470" class="line"/>
    <rect x="304" y="492" width="1092" height="112" fill="#fff"/>
    <circle cx="368" cy="552" r="22" fill="#eaf1ff"/>
    <g transform="translate(356 540) scale(.9)" class="stroke"><circle cx="13" cy="13" r="9"/><path d="m13 7 2.2 5.2L13 15l-2.2-2.8zM13 15l5 5-5-2-5 2z"/></g>
    <text x="328" y="525" fill="#e26745" font-size="13" font-weight="700" class="sans">01</text>
    <text x="410" y="531" class="ink" font-size="19" font-weight="700">从用户问题到 AI 产品机会</text>
    <text x="410" y="562" class="muted body">先学会判断：什么问题值得做成 AI 产品？</text>
    <text x="410" y="587" class="muted small">4 节课　·　已完成 2 节</text>
    <rect x="1276" y="528" width="7" height="48" rx="3.5" fill="#2a8b62"/>
    <text x="1302" y="558" class="muted small">学习中</text>
    <line x1="304" y1="604" x2="1396" y2="604" class="line"/>
    <rect x="304" y="605" width="1092" height="112" fill="#fff"/>
    <circle cx="368" cy="665" r="22" fill="#edf5f1"/>
    <g transform="translate(356 653)" class="stroke"><circle cx="5" cy="13" r="2.4"/><circle cx="21" cy="5" r="2.4"/><circle cx="21" cy="21" r="2.4"/><path d="m7 12 11-6m-11 8 11 6"/></g>
    <text x="328" y="638" fill="#e26745" font-size="13" font-weight="700" class="sans">02</text>
    <text x="410" y="644" class="ink" font-size="19" font-weight="700">工作流、模型与知识检索的组合</text>
    <text x="410" y="675" class="muted body">把模型放进流程里：知道何时自动做、何时让人确认。</text>
    <text x="410" y="700" class="muted small">6 节课　·　已完成 1 节</text>
    <rect x="1276" y="641" width="7" height="48" rx="3.5" fill="#e26745"/>
    <text x="1302" y="671" class="muted small">继续学习</text>
    <line x1="304" y1="717" x2="1396" y2="717" class="line"/>
    <rect x="304" y="718" width="1092" height="112" fill="#fff"/>
    <circle cx="368" cy="778" r="22" fill="#fff0e9"/>
    <g transform="translate(356 766)" class="stroke"><path d="M4 8h17v13H11l-5 4v-4H4z"/><path d="M9 13h.1m4 0h.1m4 0h.1" stroke-width="3"/></g>
    <text x="328" y="751" fill="#e26745" font-size="13" font-weight="700" class="sans">03</text>
    <text x="410" y="757" class="ink" font-size="19" font-weight="700">质量评估、风险控制与产品指标</text>
    <text x="410" y="788" class="muted body">上线前怎么测，出问题怎么兜底，效果如何被证明。</text>
    <text x="410" y="813" class="muted small">5 节课　·　尚未开始</text>
    <rect x="1276" y="754" width="7" height="48" rx="3.5" fill="#b7b8b5"/>
    <text x="1302" y="784" class="muted small">待开始</text>

    <!-- Quiet footer note -->
    <rect x="304" y="866" width="1092" height="74" fill="#f0f0ed"/>
    <rect x="304" y="866" width="4" height="74" fill="#e26745"/>
    <text x="328" y="896" class="ink" font-size="14" font-weight="700">学习建议</text>
    <text x="328" y="922" class="muted small">先读懂知识点，再做一道真实场景题；不需要一次学完所有技术名词。</text>

    <!-- Friendly feedback affordance in the lower-left corner. -->
    <g transform="translate(22 866)">
      <rect width="210" height="64" rx="9" fill="#fff" stroke="#e7e7e4"/>
      <circle cx="34" cy="32" r="19" fill="#fff0e9"/>
      <g transform="translate(16 5) scale(.58)"><use href="#compass-buddy"/></g>
      <text x="64" y="29" class="ink" font-size="13" font-weight="700">给学习搭子留句话</text>
      <text x="64" y="48" class="muted" font-size="11">反馈 · 建议 · 内容纠错</text>
      <path d="M185 26l6 6-6 6" fill="none" stroke="#8a8d92" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
