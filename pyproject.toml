[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-pm-learning-copilot"
version = "0.1.0"
description = "A local-first AI PM learning companion with an openly authored sample curriculum."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "chromadb>=0.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "openai>=1.54,<2",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
