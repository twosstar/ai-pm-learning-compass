<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1800" viewBox="0 0 1600 1800" role="img" aria-labelledby="title desc">
  <title id="title">AI PM 学习罗盘：检索增强生成完整知识卡片</title>
  <desc id="desc">展示 RAG 的定义、工作流程、适用场景、使用边界、业务例子、产品经理判断、面试问题和相关概念。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3f8ff"/>
      <stop offset="0.62" stop-color="#f8faff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3179e8"/>
      <stop offset="1" stop-color="#729df0"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#5979a6" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1600" height="1800" fill="url(#page)"/>
  <circle cx="1455" cy="145" r="108" fill="#e2efff" opacity="0.72"/>
  <circle cx="1510" cy="210" r="52" fill="#ecf4ff"/>

  <g font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
    <g transform="translate(80 72)">
      <path d="M18 48c-15 0-24-10-24-22 0-11 9-20 21-21 5-16 19-25 35-22 13 2 22 12 25 24 13 1 22 10 22 21 0 12-10 20-25 20H18Z" fill="#fff" stroke="#6fa0eb" stroke-width="4"/>
      <path d="m46 8 5 14 14 5-14 5-5 14-5-14-14-5 14-5 5-14Z" fill="#f5b83d" stroke="#fff" stroke-width="2"/>
    </g>
    <text x="180" y="104" fill="#234a7c" font-size="27" font-weight="700">AI PM 学习罗盘</text>
    <text x="180" y="143" fill="#66809e" font-size="21">概念地图 · 一张卡，把概念讲到能用</text>
    <text x="80" y="245" fill="#182f50" font-size="54" font-weight="750">不止知道是什么，</text>
    <text x="80" y="313" fill="#182f50" font-size="54" font-weight="750">还知道什么时候该用。</text>
    <rect x="80" y="345" width="99" height="7" rx="4" fill="url(#accent)"/>
    <text x="80" y="400" fill="#5d7695" font-size="24">从原理到边界，再到 AI 产品经理的实际判断</text>

    <rect x="64" y="450" width="1472" height="1285" rx="28" fill="#fff" stroke="#dce8f7" stroke-width="2" filter="url(#shadow)"/>
    <rect x="64" y="450" width="1472" height="12" rx="6" fill="url(#accent)"/>
    <rect x="112" y="500" width="196" height="42" rx="21" fill="#e9f2ff"/>
    <text x="137" y="529" fill="#2d64ae" font-size="20" font-weight="700">RAG 与知识检索</text>
    <rect x="324" y="500" width="112" height="42" rx="21" fill="#eef5ff"/>
    <text x="349" y="529" fill="#4d6d94" font-size="20" font-weight="700">核心概念</text>

    <text x="112" y="620" fill="#183657" font-size="47" font-weight="750">检索增强生成</text>
    <text x="112" y="662" fill="#70839b" font-size="21">Retrieval-augmented Generation · RAG</text>
    <text x="112" y="730" fill="#354b66" font-size="25" font-weight="700">一句话：先从资料里找出相关内容，再让模型照着找到的内容回答。</text>

    <line x1="112" y1="778" x2="1488" y2="778" stroke="#e5edf7" stroke-width="2"/>
    <text x="112" y="830" fill="#315d96" font-size="23" font-weight="700">它怎么运作</text>
    <text x="112" y="870" fill="#526a87" font-size="21">资料先整理入库；用户提问后，系统找到相关片段，再交给模型组织答案。</text>

    <g transform="translate(112 900)">
      <rect width="298" height="86" rx="16" fill="#f1f6ff" stroke="#d6e5fb" stroke-width="2"/>
      <text x="149" y="53" text-anchor="middle" fill="#315d96" font-size="21" font-weight="650">整理资料并入库</text>
      <text x="322" y="54" fill="#8ba6c8" font-size="30">›</text>
      <rect x="346" width="298" height="86" rx="16" fill="#f1f6ff" stroke="#d6e5fb" stroke-width="2"/>
      <text x="495" y="53" text-anchor="middle" fill="#315d96" font-size="21" font-weight="650">找出相关片段</text>
      <text x="670" y="54" fill="#8ba6c8" font-size="30">›</text>
      <rect x="694" width="298" height="86" rx="16" fill="#f1f6ff" stroke="#d6e5fb" stroke-width="2"/>
      <text x="843" y="53" text-anchor="middle" fill="#315d96" font-size="21" font-weight="650">模型组织回答</text>
      <text x="1018" y="54" fill="#8ba6c8" font-size="30">›</text>
      <rect x="1042" width="298" height="86" rx="16" fill="#eaf2ff" stroke="#c9dcf8" stroke-width="2"/>
      <text x="1191" y="53" text-anchor="middle" fill="#315d96" font-size="21" font-weight="650">展示回答依据</text>
    </g>

    <line x1="112" y1="1020" x2="1488" y2="1020" stroke="#e5edf7" stroke-width="2"/>
    <g>
      <rect x="112" y="1050" width="652" height="190" rx="18" fill="#f7faff"/>
      <rect x="112" y="1050" width="6" height="190" rx="3" fill="#4f8ce2"/>
      <text x="144" y="1092" fill="#315d96" font-size="23" font-weight="700">什么时候适合用</text>
      <text x="144" y="1138" fill="#465c77" font-size="21">答案要根据公司制度、产品资料等会更新，</text>
      <text x="144" y="1172" fill="#465c77" font-size="21">或不适合写死在模型里的内容来回答时。</text>
      <text x="144" y="1215" fill="#7990ad" font-size="18">比如制度问答、产品知识库、内部资料检索</text>

      <rect x="784" y="1050" width="704" height="190" rx="18" fill="#fbf9ff"/>
      <rect x="784" y="1050" width="6" height="190" rx="3" fill="#8e78cf"/>
      <text x="816" y="1092" fill="#66539e" font-size="23" font-weight="700">什么时候别急着用</text>
      <text x="816" y="1138" fill="#465c77" font-size="21">固定规则计算、简单闲聊，或没有可靠资料可查时，</text>
      <text x="816" y="1172" fill="#465c77" font-size="21">RAG 不一定有帮助；找错资料会让错误答案更像真的。</text>
      <text x="816" y="1215" fill="#8578a4" font-size="18">检索结果不可靠，模型也不能凭空补救</text>
    </g>

    <rect x="112" y="1270" width="1376" height="168" rx="18" fill="#f2f7ff"/>
    <text x="144" y="1312" fill="#315d96" font-size="23" font-weight="700">一个业务场景</text>
    <text x="144" y="1355" fill="#465c77" font-size="21">员工询问报销规则时，助手先检索当前生效的制度条款，再基于条款回答并展示出处；</text>
    <text x="144" y="1390" fill="#465c77" font-size="21">找不到适用条款就说明无法确认。产品要负责资料更新、权限过滤和无答案流程。</text>

    <g>
      <text x="112" y="1490" fill="#315d96" font-size="23" font-weight="700">AI PM 怎么判断</text>
      <text x="112" y="1532" fill="#465c77" font-size="20">资料谁来更新？用户能看哪些内容？查不到怎么办？答案是否被</text>
      <text x="112" y="1564" fill="#465c77" font-size="20">检索到的依据支持？这些比“接上 RAG”更决定产品是否可靠。</text>
      <line x1="800" y1="1475" x2="800" y2="1580" stroke="#e2eaf5" stroke-width="2"/>
      <text x="846" y="1490" fill="#a46a24" font-size="23" font-weight="700">面试常问</text>
      <text x="846" y="1538" fill="#465c77" font-size="21">RAG 为什么适合经常变化的企业制度问答？</text>
    </g>

    <line x1="112" y1="1615" x2="1488" y2="1615" stroke="#e5edf7" stroke-width="2"/>
    <text x="112" y="1662" fill="#71839a" font-size="19">同主题继续阅读</text>
    <g font-size="18" font-weight="650">
      <rect x="112" y="1680" width="122" height="38" rx="19" fill="#eaf2ff"/>
      <text x="173" y="1705" text-anchor="middle" fill="#315d96">文本分块</text>
      <rect x="248" y="1680" width="122" height="38" rx="19" fill="#eaf2ff"/>
      <text x="309" y="1705" text-anchor="middle" fill="#315d96">向量数据库</text>
      <rect x="384" y="1680" width="110" height="38" rx="19" fill="#eaf2ff"/>
      <text x="439" y="1705" text-anchor="middle" fill="#315d96">语义搜索</text>
      <rect x="508" y="1680" width="122" height="38" rx="19" fill="#eaf2ff"/>
      <text x="569" y="1705" text-anchor="middle" fill="#315d96">重排序</text>
    </g>
  </g>
</svg>
